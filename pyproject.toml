[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dbugs-cli"
version = "0.1.0"
description = "CLI for querying the dbugs.ptsecurity.com vulnerability database"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "typer>=0.12", "rich>=13.0"]

[project.scripts]
dbugs = "dbugs_cli.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[tool.setuptools.packages.find]
include = ["dbugs_cli*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
